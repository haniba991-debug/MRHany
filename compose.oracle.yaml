services:
  app:
    build: .
    env_file:
      - .env.production
    expose:
      - "8080"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - generated_files:/tmp/mr-hany-files

  caddy:
    image: caddy:2
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  generated_files:
