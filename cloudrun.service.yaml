apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mr-hany-telegram-bot
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Keep CPU allocated after HTTP 200 OK so async AI & document generation jobs never freeze
        run.googleapis.com/cpu-throttling: "false"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/gen-lang-client-0702633943/mr-hany-repo/mr-hany-bot:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: NODE_ENV
              value: production
            - name: TELEGRAM_MODE
              value: webhook
            - name: WEBHOOK_EXECUTION_MODE
              value: async
            - name: TELEGRAM_AUTO_SET_WEBHOOK
              value: "true"
            - name: ENABLE_FIRESTORE_DEDUP
              value: "false"
            - name: LOG_FORMAT
              value: json
            - name: TELEGRAM_WEBHOOK_URL
              value: https://YOUR-CLOUD-RUN-SERVICE-URL/telegram/webhook
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-bot-token
                  key: latest
            - name: TELEGRAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: telegram-webhook-secret
                  key: latest
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: mr-hany-admin-secret
                  key: latest
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
